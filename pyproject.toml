[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-vidi"
version = "0.1.0"
description = "A read-only terminal viewer for a local Git repository."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "affaan-git", email = "216245812+affaan-git@users.noreply.github.com" },
]
keywords = [
    "git",
    "git-view",
    "vidi",
    "textual",
    "tui",
    "terminal",
    "cli",
    "repository",
    "viewer",
    "history",
    "commits",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=6.2,<9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/affaan-git/vidi"
Repository = "https://github.com/affaan-git/vidi"
Issues = "https://github.com/affaan-git/vidi/issues"

[project.scripts]
vidi = "vidi.cli:main"
git-view = "vidi.cli:main"
git-vidi = "vidi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/man/man1" = ["man/vidi.1", "man/git-view.1", "man/git-vidi.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
