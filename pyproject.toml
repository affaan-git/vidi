[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-viewer-textual"
version = "0.1.0"
description = "Terminal-first local git repository viewer built with Textual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.1.1",
]

[project.scripts]
git-viewer-textual = "git_viewer_textual.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
