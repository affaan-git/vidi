[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-viewer-textual"
version = "0.1.0"
description = "Terminal-first local git repository viewer built with Textual."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "affaan-git", email = "216245812+affaan-git@users.noreply.github.com" },
]
keywords = ["git", "textual", "tui", "terminal", "repository", "viewer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.1.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/affaan-git/git-viewer-textual"
Repository = "https://github.com/affaan-git/git-viewer-textual"
Issues = "https://github.com/affaan-git/git-viewer-textual/issues"

[project.scripts]
git-viewer-textual = "git_viewer_textual.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
